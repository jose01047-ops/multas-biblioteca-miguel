name: Pruebas del proyecto

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar siete pruebas
        run: python pruebas.py
